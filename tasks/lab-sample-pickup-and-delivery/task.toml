format_version = "1.0"

[task]
task_id = "lab-sample-pickup-and-delivery"
instruction_file = "instruction.md"

[metadata]
author_name = "HackerRank"
difficulty = "hard"
category = "full-stack"
tags = ["go", "react", "typescript", "mongodb", "realtime", "concurrency"]

[environment]
setup_cmd = "bash /opt/arena/bin/start-services.sh"
